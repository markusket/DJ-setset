[project]
name = "setinrakentaja"
version = "1.0.0"
description = "Rekordbox-soittolistojen kokoaja: suodata, järjestä harmonisesti ja vie rekordbox.xml-tiedostoksi."
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6"]

[project.scripts]
setinrakentaja = "setinrakentaja.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
